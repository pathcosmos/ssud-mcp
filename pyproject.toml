[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ssud-mcp"
version = "0.2.0"
description = "A local MCP client for file management on an SSUD server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "mcp>=1.26,<2"]

[project.scripts]
ssud-mcp = "ssud_mcp.server:main"

[project.urls]
Repository = "https://github.com/pathcosmos/ssud-mcp"
Issues = "https://github.com/pathcosmos/ssud-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
